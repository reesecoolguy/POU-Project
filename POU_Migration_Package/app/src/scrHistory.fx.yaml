scrHistory As screen:
    Fill: =RGBA(242, 242, 242, 1)
    OnVisible: |-
        =If(IsBlank(varSession) And Not(varSupMode), Navigate(scrLogin, ScreenTransition.None));
        Set(varLastActivity, Now());
        Reset(txtHistItemHist);
        Refresh(POURequests)
    recHdrHist As rectangle:
        X: =0
        Y: =0
        Width: =1366
        Height: =64
        Fill: =RGBA(31, 56, 100, 1)
    lblHdrStationHist As label:
        X: =12
        Y: =4
        Width: =260
        Height: =28
        Text: ="Station " & varStation
        Size: =16
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    lblHdrUserHist As label:
        X: =12
        Y: =32
        Width: =560
        Height: =28
        Text: =If(varSupMode, varEmpName & " (supervisor, signed in as " & User().Email & ")", varEmpName & " - badge session")
        Size: =14
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Normal
        Wrap: =true
        AutoHeight: =false
    lblHdrIdleHist As label:
        X: =1040
        Y: =4
        Width: =200
        Height: =24
        Text: ="Auto sign-out in " & Max(0, varIdleMin * 60 - DateDiff(varLastActivity, varTick, TimeUnit.Seconds)) & " s"
        Size: =12
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Right
        FontWeight: =FontWeight.Normal
        Wrap: =true
        AutoHeight: =false
    btnHdrOutHist As button:
        X: =1250
        Y: =12
        Width: =104
        Height: =40
        Text: ="Sign out"
        OnSelect: |-
            =If(
                Not(IsBlank(varSession)),
                IfError('POU-Session'.Run("LOGOUT", "", varStation, varSession, Lower(User().Email)), true)
            );
            Set(varSession, "");
            Set(varEmpName, "");
            Set(varRole, "");
            Set(varSupMode, false);
            Clear(colStock);
            Navigate(scrLogin, ScreenTransition.None)
        Fill: =RGBA(192, 80, 77, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        HoverFill: =ColorFade(RGBA(192, 80, 77, 1), -15%)
        PressedFill: =ColorFade(RGBA(192, 80, 77, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
    tmrIdleHist As timer:
        X: =0
        Y: =0
        Width: =6
        Height: =6
        Duration: =1000
        Repeat: =true
        AutoStart: =false
        Start: =true
        OnTimerEnd: |-
            =Set(varTick, Now());
            If(
                (Not(IsBlank(varSession)) Or varSupMode) And DateDiff(varLastActivity, varTick, TimeUnit.Seconds) >= varIdleMin * 60,
                If(
                    Not(IsBlank(varSession)),
                    IfError('POU-Session'.Run("LOGOUT", "", varStation, varSession, Lower(User().Email)), true)
                );
                Set(varSession, "");
                Set(varEmpName, "");
                Set(varRole, "");
                Set(varSupMode, false);
                Clear(colStock);
                Navigate(scrLogin, ScreenTransition.None)
            )
        Fill: =RGBA(0, 0, 0, 0)
        Color: =RGBA(0, 0, 0, 0)
        BorderThickness: =0
        BorderColor: =RGBA(0, 0, 0, 0)
        DisplayMode: =DisplayMode.View
    btnNavScanHist As button:
        X: =580
        Y: =18
        Width: =110
        Height: =36
        Text: ="Add / Remove"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrScan, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =Not(varSupMode)
    btnNavAuditHist As button:
        X: =695
        Y: =18
        Width: =100
        Height: =36
        Text: ="Count"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrAudit, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =true
    btnNavAddItemHist As button:
        X: =800
        Y: =18
        Width: =100
        Height: =36
        Text: ="New item"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrAddItem, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =true
    btnNavLowHist As button:
        X: =905
        Y: =18
        Width: =100
        Height: =36
        Text: ="Low stock"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrLowStock, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =true
    btnNavHistHist As button:
        X: =1010
        Y: =18
        Width: =100
        Height: =36
        Text: ="History"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrHistory, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =true
    btnNavSupHist As button:
        X: =1115
        Y: =18
        Width: =110
        Height: =36
        Text: ="Supervisor"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrSupervisor, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =varSupMode
    btnNavAdminHist As button:
        X: =1230
        Y: =18
        Width: =100
        Height: =36
        Text: ="Admin"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrAdmin, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =varSupMode
    lblReqTitleHist As label:
        X: =24
        Y: =76
        Width: =520
        Height: =28
        Text: ="Requests from this station - with processing status"
        Size: =16
        Color: =RGBA(32, 32, 32, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    btnRefreshHist As button:
        X: =560
        Y: =72
        Width: =110
        Height: =34
        Text: ="Refresh"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Refresh(POURequests); Refresh(POULedger)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
    galReqHist As gallery.galleryVertical:
        X: =24
        Y: =110
        Width: =650
        Height: =600
        TemplateSize: =84
        Items: =FirstN(SortByColumns(Filter(POURequests, StationID = varStation), "ID", SortOrder.Descending), 50)
        TemplateFill: =Switch(ThisItem.RequestStatus.Value, "Succeeded", RGBA(198, 239, 206, 1), "Rejected", RGBA(255, 199, 206, 1), "Failed", RGBA(255, 199, 206, 1), "AwaitingSupervisor", RGBA(255, 230, 153, 1), "Pending", RGBA(255, 230, 153, 1), "Processing", RGBA(255, 230, 153, 1), RGBA(255, 255, 255, 1))
        lblReqRowHist As label:
            X: =8
            Y: =4
            Width: =634
            Height: =76
            Text: =ThisItem.RequestType.Value & "  " & Coalesce(ThisItem.Title, "") & Char(10) & ThisItem.RequestStatus.Value & If(ThisItem.IsOpen, "  (open)", "") & "  -  " & Coalesce(ThisItem.ResultMessage, "") & Char(10) & Text(ThisItem.Created, "mmm d, h:mm AM/PM") & "  |  request " & Left(ThisItem.RequestID, 8) & If(ThisItem.InventoryEffect.Value = "Unknown", "  |  EFFECT UNKNOWN - tell a supervisor", "")
            Size: =12
            Color: =RGBA(32, 32, 32, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Left
            FontWeight: =FontWeight.Normal
            Wrap: =true
            AutoHeight: =false
        btnReCheckHist As button:
            X: =540
            Y: =50
            Width: =96
            Height: =28
            Text: ="Re-check"
            OnSelect: |-
                =Set(varLastActivity, Now());
                IfError('POU-ProcessRequest'.Run(ThisItem.RequestID), true);
                Refresh(POURequests)
            Fill: =RGBA(191, 144, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =11
            HoverFill: =ColorFade(RGBA(191, 144, 0, 1), -15%)
            PressedFill: =ColorFade(RGBA(191, 144, 0, 1), -30%)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            Visible: =ThisItem.IsOpen And ThisItem.RequestStatus.Value <> "AwaitingSupervisor"
    lblLedTitleHist As label:
        X: =690
        Y: =76
        Width: =660
        Height: =28
        Text: ="Ledger (every posted movement). Legacy = imported from the old workbook, not part of the balance."
        Size: =14
        Color: =RGBA(32, 32, 32, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    txtHistItemHist As text:
        X: =690
        Y: =110
        Width: =360
        Height: =40
        HintText: ="Item number (blank = latest 60)"
        Default: =""
        Size: =18
        OnChange: =Set(varLastActivity, Now())
        DelayOutput: =false
        TabIndex: =1
    galLedHist As gallery.galleryVertical:
        X: =690
        Y: =156
        Width: =660
        Height: =554
        TemplateSize: =66
        Items: =If(IsBlank(Upper(Trim(Substitute(txtHistItemHist.Text, "*", "")))), FirstN(SortByColumns(POULedger, "ID", SortOrder.Descending), 60), FirstN(SortByColumns(Filter(POULedger, ItemID = Upper(Trim(Substitute(txtHistItemHist.Text, "*", "")))), "ID", SortOrder.Descending), 60))
        TemplateFill: =If(ThisItem.Origin.Value = "Legacy", RGBA(237, 237, 237, 1), If(ThisItem.PostingState.Value = "Posted", RGBA(255, 255, 255, 1), RGBA(255, 230, 153, 1)))
        lblLedRowHist As label:
            X: =8
            Y: =4
            Width: =644
            Height: =58
            Text: =ThisItem.LedgerType.Value & If(ThisItem.Origin.Value = "Legacy", " (LEGACY)", "") & " " & ThisItem.ItemID & " @ " & Coalesce(ThisItem.LocationCode, "?") & "  delta " & Coalesce(Text(ThisItem.QtyDelta), "-") & "  -> " & Coalesce(Text(ThisItem.QtyAfter), "-") & Char(10) & Coalesce(ThisItem.EmployeeName, ThisItem.LegacyUser, "?") & "  |  " & Coalesce(ThisItem.OccurredLocalText, ThisItem.LegacyTimestampText, Text(ThisItem.OccurredUtc, "mmm d, h:mm AM/PM")) & If(ThisItem.PostingState.Value <> "Posted", "  |  " & ThisItem.PostingState.Value, "")
            Size: =12
            Color: =RGBA(32, 32, 32, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Left
            FontWeight: =FontWeight.Normal
            Wrap: =true
            AutoHeight: =false
