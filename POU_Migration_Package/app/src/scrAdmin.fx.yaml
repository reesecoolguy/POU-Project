    lblAdmTitleAdmin As label:
        X: =24
        Y: =76
        Width: =900
        Height: =28
        Text: ="Settings (central configuration). Changes are versioned in SharePoint; flows read them on every run."
        Size: =15
        Color: =RGBA(32, 32, 32, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    lblAdmWhoAdmin As label:
        X: =24
        Y: =104
        Width: =800
        Height: =28
        Text: =If(varRole = "Admin", "", "Read only - you are not an Admin. SharePoint would refuse your edits anyway.")
        Size: =13
        Color: =RGBA(255, 199, 206, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    txtSetFilterAdmin As text:
        X: =24
        Y: =136
        Width: =300
        Height: =40
        HintText: ="Filter by name..."
        Default: =""
        Size: =18
        OnChange: =Set(varLastActivity, Now())
        DelayOutput: =false
        TabIndex: =1
    galSetAdmin As gallery.galleryVertical:
        X: =24
        Y: =182
        Width: =900
        Height: =540
        TemplateSize: =52
        Items: =SortByColumns(Filter(POUSettings, StartsWith(SettingKey, Trim(txtSetFilterAdmin.Text))), "SettingKey", SortOrder.Ascending)
        lblSetKeyAdmin As label:
            X: =8
            Y: =6
            Width: =330
            Height: =40
            Text: =ThisItem.SettingKey
            Size: =14
            Color: =RGBA(32, 32, 32, 1)
            Fill: =RGBA(0, 0, 0, 0)
            Align: =Align.Left
            FontWeight: =FontWeight.Bold
            Wrap: =true
            AutoHeight: =false
        txtSetValAdmin As text:
            X: =346
            Y: =4
            Width: =360
            Height: =44
            HintText: ="value"
            Default: =ThisItem.SettingValue
            Size: =14
            OnChange: =false
            DelayOutput: =false
            DisplayMode: =If(varRole = "Admin", DisplayMode.Edit, DisplayMode.View)
        btnSetSaveAdmin As button:
            X: =720
            Y: =6
            Width: =100
            Height: =40
            Text: ="Save"
            OnSelect: |-
                =Set(varLastActivity, Now());
                IfError(
                    Patch(POUSettings, ThisItem, {SettingValue: Trim(txtSetValAdmin.Text)});
                    Notify("Saved " & ThisItem.SettingKey, NotificationType.Success),
                    Notify("NOT saved: " & FirstError.Message, NotificationType.Error)
                )
            Fill: =RGBA(84, 130, 53, 1)
            Color: =RGBA(255, 255, 255, 1)
            Size: =13
            HoverFill: =ColorFade(RGBA(84, 130, 53, 1), -15%)
            PressedFill: =ColorFade(RGBA(84, 130, 53, 1), -30%)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            DisplayMode: =If(varRole = "Admin", DisplayMode.Edit, DisplayMode.Disabled)
    lblLocTitleAdmin As label:
        X: =950
        Y: =104
        Width: =390
        Height: =28
        Text: ="Locations"
        Size: =16
        Color: =RGBA(32, 32, 32, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    txtNewLocAdmin As text:
        X: =950
        Y: =136
        Width: =250
        Height: =44
        HintText: ="New location code"
        Default: =""
        Size: =18
        OnChange: =Set(varLastActivity, Now())
        DelayOutput: =false
        DisplayMode: =If(varRole = "Admin", DisplayMode.Edit, DisplayMode.Disabled)
        TabIndex: =2
    btnNewLocAdmin As button:
        X: =1210
        Y: =136
        Width: =130
        Height: =44
        Text: ="Add"
        OnSelect: |-
            =Set(varLastActivity, Now());
            If(
                Len(Upper(Trim(Substitute(txtNewLocAdmin.Text, "*", "")))) > 0 And IsBlank(LookUp(POULocations, LocationCode = Upper(Trim(Substitute(txtNewLocAdmin.Text, "*", ""))))),
                IfError(
                    Patch(POULocations, Defaults(POULocations), {Title: Upper(Trim(Substitute(txtNewLocAdmin.Text, "*", ""))), LocationCode: Upper(Trim(Substitute(txtNewLocAdmin.Text, "*", ""))), Description: "", Active: true});
                    Reset(txtNewLocAdmin);
                    Notify("Location added", NotificationType.Success),
                    Notify("NOT added: " & FirstError.Message, NotificationType.Error)
                ),
                Notify("Enter a new location code that is not already in the list.", NotificationType.Warning)
            )
        Fill: =RGBA(84, 130, 53, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        HoverFill: =ColorFade(RGBA(84, 130, 53, 1), -15%)
        PressedFill: =ColorFade(RGBA(84, 130, 53, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        DisplayMode: =If(varRole = "Admin", DisplayMode.Edit, DisplayMode.Disabled)
        TabIndex: =3
