scrAdmin As screen:
    Fill: =RGBA(242, 242, 242, 1)
    OnVisible: |-
        =If(Not(varSupMode), Navigate(scrLogin, ScreenTransition.None));
        Set(varLastActivity, Now());
        Refresh(POUSettings)
    recHdrAdmin As rectangle:
        X: =0
        Y: =0
        Width: =1366
        Height: =64
        Fill: =RGBA(31, 56, 100, 1)
    lblHdrStationAdmin As label:
        X: =12
        Y: =4
        Width: =260
        Height: =28
        Text: ="Station " & varStation
        Size: =16
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Bold
        Wrap: =true
        AutoHeight: =false
    lblHdrUserAdmin As label:
        X: =12
        Y: =32
        Width: =560
        Height: =28
        Text: =If(varSupMode, varEmpName & " (supervisor, signed in as " & User().Email & ")", varEmpName & " - badge session")
        Size: =14
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Left
        FontWeight: =FontWeight.Normal
        Wrap: =true
        AutoHeight: =false
    lblHdrIdleAdmin As label:
        X: =1040
        Y: =4
        Width: =200
        Height: =24
        Text: ="Auto sign-out in " & Max(0, varIdleMin * 60 - DateDiff(varLastActivity, varTick, TimeUnit.Seconds)) & " s"
        Size: =12
        Color: =RGBA(255, 255, 255, 1)
        Fill: =RGBA(0, 0, 0, 0)
        Align: =Align.Right
        FontWeight: =FontWeight.Normal
        Wrap: =true
        AutoHeight: =false
    btnHdrOutAdmin As button:
        X: =1250
        Y: =12
        Width: =104
        Height: =40
        Text: ="Sign out"
        OnSelect: |-
            =If(
                Not(IsBlank(varSession)),
                IfError('POU-Session'.Run("LOGOUT", "", varStation, varSession, Lower(User().Email)), true)
            );
            Set(varSession, "");
            Set(varEmpName, "");
            Set(varRole, "");
            Set(varSupMode, false);
            Clear(colStock);
            Navigate(scrLogin, ScreenTransition.None)
        Fill: =RGBA(192, 80, 77, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        HoverFill: =ColorFade(RGBA(192, 80, 77, 1), -15%)
        PressedFill: =ColorFade(RGBA(192, 80, 77, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
    tmrIdleAdmin As timer:
        X: =0
        Y: =0
        Width: =6
        Height: =6
        Duration: =1000
        Repeat: =true
        AutoStart: =false
        Start: =true
        OnTimerEnd: |-
            =Set(varTick, Now());
            If(
                (Not(IsBlank(varSession)) Or varSupMode) And DateDiff(varLastActivity, varTick, TimeUnit.Seconds) >= varIdleMin * 60,
                If(
                    Not(IsBlank(varSession)),
                    IfError('POU-Session'.Run("LOGOUT", "", varStation, varSession, Lower(User().Email)), true)
                );
                Set(varSession, "");
                Set(varEmpName, "");
                Set(varRole, "");
                Set(varSupMode, false);
                Clear(colStock);
                Navigate(scrLogin, ScreenTransition.None)
            )
        Fill: =RGBA(0, 0, 0, 0)
        Color: =RGBA(0, 0, 0, 0)
        BorderThickness: =0
        BorderColor: =RGBA(0, 0, 0, 0)
        DisplayMode: =DisplayMode.View
    btnNavScanAdmin As button:
        X: =580
        Y: =18
        Width: =110
        Height: =36
        Text: ="Add / Remove"
        OnSelect: |-
            =Set(varLastActivity, Now());
            Navigate(scrScan, ScreenTransition.None)
        Fill: =RGBA(68, 114, 196, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =12
        HoverFill: =ColorFade(RGBA(68, 114, 196, 1), -15%)
        PressedFill: =ColorFade(RGBA(68, 114, 196, 1), -30%)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =Not(varSupMode)
    btnNavAuditAdmin As button:
